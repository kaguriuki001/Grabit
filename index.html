<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrabIt</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:radial-gradient(circle at top,#1e293b,#0f172a 60%)}</style>
</head>
<body class="min-h-screen text-slate-100 font-sans">
<header class="w-full flex justify-center py-6">
  <div class="flex items-center gap-2 text-2xl font-bold"><span class="text-indigo-400">▶</span> GrabIt</div>
</header>
<main class="max-w-3xl mx-auto px-4 text-center mt-10">
  <h1 class="text-4xl md:text-5xl font-extrabold leading-tight">Download videos in <span class="text-indigo-400">one click</span></h1>
  <p class="text-slate-400 mt-3">Paste a link from YouTube, Vimeo, Twitter/X, or 1000+ sites.</p>
  <div class="mt-8 flex flex-col sm:flex-row gap-3 bg-slate-800/60 p-2 rounded-2xl border border-slate-700">
    <input id="u" type="url" placeholder="https://youtube.com/watch?v=..." class="flex-1 bg-transparent px-4 py-3 rounded-xl outline-none placeholder-slate-500 text-slate-100">
    <button onclick="go()" id="btn" class="bg-indigo-500 hover:bg-indigo-400 transition px-6 py-3 rounded-xl font-semibold disabled:opacity-50">Fetch</button>
  </div>
  <p id="err" class="text-rose-400 text-sm mt-3 hidden"></p>
  <div id="result" class="mt-8 hidden">
    <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-5 text-left">
      <div class="flex gap-4 items-start">
        <img id="thumb" class="w-32 rounded-lg object-cover">
        <div class="flex-1 min-w-0">
          <h2 id="title" class="font-semibold text-base leading-snug truncate"></h2>
          <div id="formats" class="mt-3 flex flex-wrap gap-2"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="loading" class="mt-10 hidden">
    <div class="inline-block w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-slate-400 mt-2 text-sm">Fetching… (first time ~5s)</p>
  </div>
</main>
<footer class="text-center text-xs text-slate-500 mt-20 px-4 pb-10">For educational use only. Not affiliated with YouTube.</footer>
<script>
const $=id=>document.getElementById(id);
async function go(){
  const url=$('u').value.trim();
  $('err').classList.add('hidden');$('result').classList.add('hidden');
  if(!url)return showErr('Paste a URL first.');
  $('loading').classList.remove('hidden');$('btn').disabled=true;
  try{
    const r=await fetch('/info?url='+encodeURIComponent(url));
    if(!r.ok)throw new Error('Fetch failed');
    const info=await r.json();
    if(info.error)throw new Error(info.error);
    $('title').textContent=info.title;
    $('thumb').src=info.thumb;
    $('formats').innerHTML=info.formats.map(f=>
      `<a href="/download?url=${encodeURIComponent(url)}&format_id=${encodeURIComponent(f.id)}"
          class="bg-slate-700 hover:bg-indigo-500 transition px-3 py-2 rounded-lg text-sm font-medium whitespace-nowrap">${f.label}</a>`
    ).join('');
    $('result').classList.remove('hidden');
  }catch(e){showErr(e.message);}
  finally{$('loading').classList.add('hidden');$('btn').disabled=false;}
}
function showErr(m){const el=$('err');el.textContent=m;el.classList.remove('hidden');}
$('u').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script>
</body>
</html>
